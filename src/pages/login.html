<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./../style/login.css">
    <title>Login | Essenza Imóveis</title>

<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >
</head>

<body>
    <main class="login-container">
        <section class="login-card">

            <div class="brand">
                <img
                    src="../img/essenza.png"
                    alt="Logo Essenza"
                    class="logo"
                >

                <h1>Essenza<span class="gold">.</span></h1>
                <p>Seu próximo endereço começa aqui.</p>
            </div>

            <div class="auth-tabs">
                <button
                    type="button"
                    class="auth-tab active"
                    id="tabLogin"
                >
                    Entrar
                </button>

                <button
                    type="button"
                    class="auth-tab"
                    id="tabCadastro"
                >
                    Criar conta
                </button>
            </div>

            <div id="mensagem" class="message" role="status"
                 aria-live="polite"></div>

            <!-- FORMULÁRIO DE LOGIN -->
            <form id="formLogin">
                <div class="mb-3">
                    <label for="emailLogin" class="form-label">
                        E-mail
                    </label>

                    <input
                        type="email"
                        id="emailLogin"
                        class="form-control"
                        placeholder="seuemail@exemplo.com"
                        autocomplete="email"
                        required
                    >
                </div>

                <div class="mb-4">
                    <label for="senhaLogin" class="form-label">
                        Senha
                    </label>

                    <input
                        type="password"
                        id="senhaLogin"
                        class="form-control"
                        placeholder="Digite sua senha"
                        autocomplete="current-password"
                        required
                    >
                </div>

                <button type="submit" class="btn-gold">
                    Entrar na conta
                </button>
            </form>

            <!-- FORMULÁRIO DE CADASTRO -->
            <form id="formCadastro" hidden>
                <div class="mb-3">
                    <label for="nomeCadastro" class="form-label">
                        Nome completo
                    </label>

                    <input
                        type="text"
                        id="nomeCadastro"
                        class="form-control"
                        placeholder="Seu nome"
                        autocomplete="name"
                        maxlength="80"
                        required
                    >
                </div>

                <div class="mb-3">
                    <label for="emailCadastro" class="form-label">
                        E-mail
                    </label>

                    <input
                        type="email"
                        id="emailCadastro"
                        class="form-control"
                        placeholder="seuemail@exemplo.com"
                        autocomplete="email"
                        required
                    >
                </div>

                <div class="mb-3">
                    <label for="senhaCadastro" class="form-label">
                        Senha
                    </label>

                    <input
                        type="password"
                        id="senhaCadastro"
                        class="form-control"
                        placeholder="Mínimo de 6 caracteres"
                        autocomplete="new-password"
                        minlength="6"
                        required
                    >
                </div>

                <div class="mb-4">
                    <label for="confirmarSenha" class="form-label">
                        Confirmar senha
                    </label>

                    <input
                        type="password"
                        id="confirmarSenha"
                        class="form-control"
                        placeholder="Digite a senha novamente"
                        autocomplete="new-password"
                        minlength="6"
                        required
                    >
                </div>

                <button type="submit" class="btn-gold">
                    Criar minha conta
                </button>
            </form>

            <a href="../../index.html" class="back-link">
                ← Voltar para a página inicial
            </a>

            <p class="security-note">
                Ambiente demonstrativo para projeto escolar.
            </p>
        </section>
    </main>

    <script src="../js/login.js"></script>
</body>
</html>
